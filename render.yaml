services:
  - type: web
    name: bshaxsiy-telegram-bot
    runtime: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
