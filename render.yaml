services:
  - type: worker
    name: bshaxsiy-telegram-bot
    runtime: docker
    region: frankfurt
    plan: starter
    autoDeploy: true
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
